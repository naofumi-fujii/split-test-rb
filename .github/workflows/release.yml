name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Update version and create tag
        id: version
        run: ./scripts/release.sh ${{ inputs.bump }}

      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build gem
        run: gem build split-test-rb.gemspec

      - name: Push gem
        run: gem push split-test-rb-${{ steps.version.outputs.version }}.gem

      - name: Wait for release to propagate
        run: gem exec rubygems-await split-test-rb-${{ steps.version.outputs.version }}.gem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: split-test-rb-${{ steps.version.outputs.version }}.gem
          generate_release_notes: true
