name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(ruby -r ./lib/split_test_rb/version -e 'puts SplitTestRb::VERSION')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Creating tag $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.tag != ''
        run: |
          git tag ${{ steps.check.outputs.tag }}
          git push origin ${{ steps.check.outputs.tag }}

  push:
    runs-on: ubuntu-latest
    needs: [create-tag]
    if: |
      always() && (
        (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
        (needs.create-tag.result == 'success' && needs.create-tag.outputs.tag != '')
      )
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-tag.outputs.tag || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: rubygems/release-gem@v1
